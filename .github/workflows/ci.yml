name: CabinLab checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # 固定在当前 Playwright 版本支持的系统，避免 runner 默认镜像升级破坏验收。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance against production build
        run: |
          npm start > /tmp/cabinlab-server.log 2>&1 &
          python scripts/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
